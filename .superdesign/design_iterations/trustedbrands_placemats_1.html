<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trusted Brands · Diner Placemats · Highway 420 (Mockup)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --parchment: #f0e6d0;
      --parchment-deep: #e6dcc2;
      --placemat: #fdf6e8;
      --placemat-deep: #f7ecd0;
      --ochre: #b57a2a;
      --ochre-deep: #8b5a18;
      --ink: #2a1a06;
      --ink-soft: #5a4018;
    }

    html, body {
      background: var(--parchment);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .mock-masthead {
      background: linear-gradient(145deg, #213d2c 0%, #162a1d 55%, #112318 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px;
      color: #fff;
    }
    .mock-masthead .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #e8920a;
    }

    /* ── SECTION BAND ── */
    .brands-band {
      position: relative;
      background:
        /* Subtle paper grain via radial noise */
        radial-gradient(circle at 15% 25%, rgba(139, 90, 24, 0.035) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(80, 50, 10, 0.04) 0%, transparent 50%),
        linear-gradient(180deg, var(--parchment) 0%, var(--parchment-deep) 100%);
      padding: 80px 16px 96px;
      border-top: 1px dashed rgba(139, 90, 24, 0.35);
      border-bottom: 1px dashed rgba(139, 90, 24, 0.35);
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(44px, 6vw, 78px);
      line-height: 0.95;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin: 0 0 10px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .section-underline {
      height: 2px;
      width: 180px;
      margin: 0 auto;
      background: repeating-linear-gradient(
        90deg,
        var(--ochre) 0, var(--ochre) 9px,
        transparent 9px, transparent 18px
      );
    }
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ochre-deep);
      margin-bottom: 14px;
    }
    .section-sub {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 17px;
      font-style: italic;
      color: var(--ink-soft);
      margin-top: 18px;
      font-weight: 400;
    }

    /* ── GRID ── */
    .brand-grid {
      max-width: 1100px;
      margin: 56px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    @media (max-width: 720px) {
      .brand-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── PLACEMAT CARD ── */
    .placemat {
      position: relative;
      background: linear-gradient(180deg, #fefaf0 0%, var(--placemat) 55%, var(--placemat-deep) 100%);
      border-radius: 8px;
      aspect-ratio: 3 / 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* Laminated ochre rope-stitch double border */
      box-shadow:
        inset 0 0 0 2px var(--ochre),
        inset 0 0 0 3px rgba(255, 252, 240, 0.8),
        inset 0 0 0 5px var(--ochre),
        0 4px 10px rgba(80, 50, 15, 0.14),
        0 1px 2px rgba(80, 50, 15, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    /* Dashed "stitch" line just inside the rope border */
    .placemat::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(139, 90, 24, 0.45);
      border-radius: 4px;
      pointer-events: none;
    }
    /* Laminated sheen */
    .placemat::after {
      content: "";
      position: absolute;
      inset: 6px;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255,255,255,0.45) 0%, transparent 30%);
      border-radius: 5px;
    }
    .placemat:hover {
      transform: translateY(-4px);
      box-shadow:
        inset 0 0 0 2px var(--ochre),
        inset 0 0 0 3px rgba(255, 252, 240, 0.8),
        inset 0 0 0 5px var(--ochre),
        0 10px 22px rgba(80, 50, 15, 0.22),
        0 4px 8px rgba(80, 50, 15, 0.14);
    }

    .placemat img {
      max-width: 100%;
      max-height: 80%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      transition: transform 0.25s ease;
    }
    .placemat:hover img {
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <header class="mock-masthead">
    <div class="max-w-[1280px] mx-auto flex items-center justify-between">
      <span class="logo">HIGHWAY 420</span>
      <span class="text-[10px] tracking-[0.2em] uppercase text-white/55">[ mock masthead ]</span>
    </div>
  </header>

  <!-- ── SECTION ── -->
  <section class="brands-band">
    <div class="max-w-[1100px] mx-auto text-center">
      <p class="eyebrow">Every Great Brand · On the Menu</p>
      <h2 class="section-title">BRANDS WE CARRY</h2>
      <div class="section-underline"></div>
      <p class="section-sub">Curated favorites from the road — all stocked with COAs.</p>
    </div>

    <div class="brand-grid" id="brand-grid"></div>
  </section>

  <footer class="text-center py-6 text-[10px] tracking-[0.2em] uppercase" style="color: var(--ink-soft);">
    [ mock footer ]
  </footer>

  <script>
    const BRANDS = [
      { name: "Cookies",       logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/Cookies%20Logo.webp" },
      { name: "Crave",         logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/crave-logo-black-150x96.png" },
      { name: "Mush Caps",     logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/Mush-Caps-Logo.webp" },
      { name: "Hidden Hills",  logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/Hidden-Hills_logo.webp" },
      { name: "Truemoola",     logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/Truemoola.png" },
      { name: "Urth Farmacy",  logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/website-images/Brand%20Logos/Urth_Farmacy_logo.webp" },
      { name: "Zoomers",       logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/Highway420_assets/assets/Logos/Zoomers.png" },
      { name: "Astro Eight",   logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/Highway420_assets/assets/Logos/Astro%20Eight.png" },
      { name: "mmelt",         logo: "https://qirbapivptotybspnbet.supabase.co/storage/v1/object/public/Highway420_assets/assets/Logos/mmelt%20logo.png" },
    ];

    document.getElementById("brand-grid").innerHTML = BRANDS.map(b => `
      <div class="placemat" title="${b.name}">
        <img src="${b.logo}" alt="${b.name} logo" />
      </div>
    `).join("");
  </script>
</body>
</html>
