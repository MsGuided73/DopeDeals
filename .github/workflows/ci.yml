name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Versions
        run: |
          node -v
          pnpm -v

      # Informational only (won't fail the workflow)
      - name: Type-check (informational)
        continue-on-error: true
        run: pnpm typecheck

      - name: Lint (informational)
        continue-on-error: true
        run: pnpm lint

      - name: Test (informational)
        continue-on-error: true
        run: pnpm test -- --reporter=dot

      # Hard gate (this is what should pass)
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder' }}
          KAJAPAY_USERNAME: ${{ secrets.KAJAPAY_USERNAME || 'placeholder' }}
          KAJAPAY_PASSWORD: ${{ secrets.KAJAPAY_PASSWORD || 'placeholder' }}
          KAJAPAY_SOURCE_KEY: ${{ secrets.KAJAPAY_SOURCE_KEY || 'placeholder' }}
          KAJAPAY_BASE_URL: ${{ secrets.KAJAPAY_BASE_URL || 'https://placeholder.kajapay.com' }}
          KAJAPAY_SANDBOX_BASE_URL: ${{ secrets.KAJAPAY_SANDBOX_BASE_URL || 'https://sandbox.kajapay.com' }}
          KAJAPAY_SECRET_KEY: ${{ secrets.KAJAPAY_SECRET_KEY || 'placeholder' }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY || 'placeholder' }}
          SHIPSTATION_API_SECRET: ${{ secrets.SHIPSTATION_API_SECRET || 'placeholder' }}
          SHIPSTATION_BASE_URL: ${{ secrets.SHIPSTATION_BASE_URL || 'https://ssapi.shipstation.com' }}
          SHIPSTATION_WEBHOOK_URL: ${{ secrets.SHIPSTATION_WEBHOOK_URL || 'placeholder' }}
          SHIPSTATION_DEFAULT_WAREHOUSE_ID: ${{ secrets.SHIPSTATION_DEFAULT_WAREHOUSE_ID || 'placeholder' }}
          SHIPSTATION_SYNC_INTERVAL: ${{ secrets.SHIPSTATION_SYNC_INTERVAL || '3600000' }}
          SHIPSTATION_ENABLE_WEBHOOKS: ${{ secrets.SHIPSTATION_ENABLE_WEBHOOKS || 'false' }}
